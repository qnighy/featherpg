[package]
name = "featherpg-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"

[dependencies]
futures = { version = "0.3.31", optional = true, default-features = false, features = ["async-await", "std"] }
pin-project = { version = "1.1.10", optional = true }
thiserror = "2.0.17"
tokio = { version = "1.48.0", optional = true }

[dev-dependencies]
futures-test = "0.3.31"
tokio = { version = "1.48.0", features = ["io-util", "rt", "macros"] }

[features]
futures = ["dep:futures", "dep:pin-project"]
tokio = ["dep:tokio", "dep:pin-project"]
